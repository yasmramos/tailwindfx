name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Run tests with headless JavaFX
      run: xvfb-run -a mvn test -Dtestfx.headless=true -Dtestfx.robot=glass -Dtestfx.setup.timeout=2500 -Dglass.platform=monocle -Dmonocle.platform=headless
    
    - name: Generate test report
      run: mvn surefire-report:report
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Parse test results and create badge endpoint
      run: |
        PASSED=$(grep -o 'Tests run: [0-9]*' target/surefire-reports/*.txt | head -1 | grep -o '[0-9]*' || echo "0")
        cat > badge-data.json << EOF
        {
          "schemaVersion": 1,
          "label": "tests",
          "message": "${PASSED} passing",
          "color": "brightgreen"
        }
        EOF

    - name: Deploy badge endpoint to GitHub Gist
      uses: andymckay/gist-action@v2
      with:
        gist_id: badge-endpoint
        gist_token: ${{ secrets.GIST_TOKEN }}
        files: |
          test-results.json:badge-data.json
