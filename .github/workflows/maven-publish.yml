name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v2.1.3, etc.
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git
        run: |
          git config user.name "yasmramos"
          git config user.email "yasmramos95@gmail.com"

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Set release version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Releasing version $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=refs/tags/v$VERSION" >> $GITHUB_ENV

      - name: Set release version from workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${{ github.event.inputs.version }}" >> $GITHUB_ENV

      # Fallback for the `release` event and manual dispatches with an empty
      # version input: read the project version directly from the POM so the
      # build never runs with an empty -Drevision, which previously crashed
      # Maven with "version can neither be null, empty nor blank".
      - name: Resolve release version from POM
        if: env.VERSION == '' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version == '')
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version -Drevision='')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not resolve the project version from pom.xml"
            exit 1
          fi
          echo "Resolved version from POM: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          case "${{ github.event_name }}" in
            push) : ;;  # RELEASE_TAG already set from the git tag
            *) echo "RELEASE_TAG=v$VERSION" >> $GITHUB_ENV ;;
          esac

      # Run the full verify lifecycle (unit tests + integration tests) once, under
      # xvfb, relying exclusively on the surefire systemPropertyVariables defined in
      # the module poms (Monocle/Headless). Do NOT override them on the CLI: passing
      # conflicting -Dglass.platform / -Dmonocle.platform values here previously
      # broke JavaFX initialization and cascaded failures across all UI tests.
      - name: Build and test
        run: xvfb-run -a mvn --batch-mode clean verify -Drevision=${{ env.VERSION }}

      # Deploy must not rerun the whole suite; reuse the verified build output with -DskipTests.
      - name: Publish to Maven Central
        if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
        run: |
          # Deploy to Maven Central via Central Publisher Portal.
          # IMPORTANT: do NOT run the `clean` phase here. The central-publishing
          # plugin stages all module artifacts into the parent's target/central-staging
          # directory; running `clean` wipes it mid-reactor, so earlier modules' POMs
          # disappear from the uploaded bundle and Central rejects the deployment with
          # "Bundle has content that does NOT have a .pom file". The previous `verify`
          # step already produced a clean, fully tested build, so deploying without
          # cleaning reuses those verified outputs safely.
          GPG_ARGS=""
          if [ -n "$GPG_KEY_NAME" ]; then
            GPG_ARGS="-Dgpg.keyname=$GPG_KEY_NAME"
          fi
          mvn --batch-mode deploy \
            -DskipTests \
            -P release \
            -DperformRelease=true \
            -Drevision=${{ env.VERSION }} \
            $GPG_ARGS \
            -Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            tailwindfx-base/target/*.jar
            tailwindfx-components/target/*.jar
            tailwindfx-maven-plugin/target/*.jar
            tailwindfx-base/target/*.pom
            tailwindfx-components/target/*.pom
            tailwindfx-maven-plugin/target/*.pom
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: maven-release-artifacts
          path: |
            tailwindfx-base/target/*.jar
            tailwindfx-components/target/*.jar
            tailwindfx-maven-plugin/target/*.jar
          if-no-files-found: error

      - name: Bump revision to next development version
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          RELEASED=${{ env.VERSION }}
          # Strip the -SNAPSHOT suffix if present
          RELEASED=${RELEASED%-SNAPSHOT}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASED"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping revision to $NEXT"
          git fetch origin develop
          git checkout develop
          # Actualizar la propiedad <revision> en el pom.xml raíz
          mvn -q versions:set-property -Dproperty=revision -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: bump revision to $NEXT [skip ci]"
          git push origin develop
