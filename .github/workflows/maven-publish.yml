name: Publish to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Git
        run: |
          git config user.name "yasmramos"
          git config user.email "yasmramos95@gmail.com"

      - name: Set release version
        if: github.event_name == 'workflow_dispatch'
        run: |
          mvn --batch-mode versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false
          mvn --batch-mode versions:commit

      - name: Build and test
        run: mvn --batch-mode clean verify -DskipTests=false

      - name: Publish to Maven Central
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Import GPG key
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --keyid-format SHORT | grep -A1 "^pub" | tail -n1 | awk '{print $1}')
          
          # Deploy to OSSRH
          mvn --batch-mode clean deploy \
            -P release \
            -DperformRelease=true \
            -Dgpg.keyname=$GPG_KEY_ID \
            -Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE \
            -DaltDeploymentRepository=ossrh::default::https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            target/*.jar
            target/*.pom
          retention-days: 30
