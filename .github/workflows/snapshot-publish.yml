name: Publish Snapshot

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Configure Git
        run: |
          git config user.name "yasmramos"
          git config user.email "yasmramos95@gmail.com"

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run -a mvn --batch-mode clean verify -Drevision=0.1.1-SNAPSHOT -DskipTests=false -Dtestfx.headless=true -Dtestfx.robot=glass -Dtestfx.setup.timeout=2500 -Dglass.platform=monocle -Dmonocle.platform=headless

      - name: Publish snapshot to Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          # Deploy snapshot to Maven Central via Central Portal snapshots endpoint
          mvn --batch-mode clean deploy \
            -P snapshot \
            -Drevision=0.1.1-SNAPSHOT \
            -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: maven-snapshot-artifacts
          path: |
            target/*.jar
