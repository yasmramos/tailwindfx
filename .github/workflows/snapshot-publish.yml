name: Publish Snapshot

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Configure Git
        run: |
          git config user.name "yasmramos"
          git config user.email "yasmramos95@gmail.com"

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Resolve snapshot version
        run: |
          BASE=$(mvn -q -DforceStdout help:evaluate -Dexpression=revision)
          echo "SNAPSHOT_VERSION=${BASE%-SNAPSHOT}-SNAPSHOT" >> "$GITHUB_ENV"

      # Run the full verify lifecycle (unit tests + integration tests) once, under
      # a virtual display. The headless JavaFX properties (glass.platform=Monocle,
      # monocle.platform=Headless, testfx.*, prism.*) are defined in the surefire
      # systemPropertyVariables of each module pom.xml, so they must NOT be
      # overridden here on the command line (overriding them caused
      # ClassNotFoundExceptions such as
      # "com.sun.glass.ui.monocle.MonoclePlatformPlatformFactory" due to
      # mismatched/concatenated class names). This mirrors the CI test step in
      # .github/workflows/maven.yml.
      - name: Build and test
        run: xvfb-run -a mvn --batch-mode clean verify -Drevision=${SNAPSHOT_VERSION}

      - name: Publish snapshot to Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          # Deploy snapshot to Maven Central through the Central Publishing Portal.
          # "clean" is intentionally omitted: the previous step already ran
          # "clean verify", so cleaning again would delete the verified build
          # output and force a full recompilation before every deployment.
          mvn --batch-mode deploy \
            -P snapshot \
            -Drevision=${SNAPSHOT_VERSION} \
            -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: maven-snapshot-artifacts
          # The root aggregator produces no jar, so the module paths must be
          # listed explicitly for a multi-module build.
          path: |
            tailwindfx-base/target/*.jar
            tailwindfx-components/target/*.jar
            tailwindfx-maven-plugin/target/*.jar
          if-no-files-found: error
