name: Publish Snapshot

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Configure Git
        run: |
          git config user.name "yasmramos"
          git config user.email "yasmramos95@gmail.com"

      - name: Set snapshot version
        run: |
          # Get the base version from pom.xml (e.g., 0.1.1)
          BASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Ensure it ends with -SNAPSHOT
          if [[ ! "$BASE_VERSION".endswith("-SNAPSHOT") ]]; then
            SNAPSHOT_VERSION="${BASE_VERSION}-SNAPSHOT"
          else
            SNAPSHOT_VERSION="$BASE_VERSION"
          fi
          echo "Publishing snapshot version $SNAPSHOT_VERSION"
          mvn --batch-mode versions:set -DnewVersion=$SNAPSHOT_VERSION -DgenerateBackupPoms=false
          mvn --batch-mode versions:commit

      - name: Build and test
        run: mvn --batch-mode clean verify -DskipTests=false

      - name: Publish snapshot to Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          # Deploy snapshot to Maven Central via Central Portal snapshots endpoint
          mvn --batch-mode clean deploy \
            -P snapshot \
            -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: maven-snapshot-artifacts
          path: |
            target/*.jar
